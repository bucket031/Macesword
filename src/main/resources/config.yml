# MaceSword config.
# Change these in-game with /macesword config, or edit here and run /macesword reload.
sword:
  base_material: NETHERITE_SWORD   # any sword, e.g. DIAMOND_SWORD. Applies to newly given swords.
  activation_fall_distance: 2.0    # blocks you must fall before it turns into a mace
  visual_mace_form: true           # show the mace model while it is in mace form
smash:
  damage_multiplier: 1.0           # scales the smash bonus damage (1.0 = vanilla mace numbers)
anvil:
  cost_per_level: 2                # XP levels charged per enchantment level added with a book
